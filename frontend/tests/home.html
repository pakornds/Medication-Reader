<!doctype html>
<html lang="en">
<title>Home workflow browser check</title>
<pre id="result">Running</pre>
<iframe title="Application under test" width="900" height="720"></iframe>
<script type="module">
  const frame = document.querySelector('iframe')
  const result = document.querySelector('#result')
  const doc = () => frame.contentDocument
  const by = selector => doc()?.querySelector(selector)
  const path = () => frame.contentWindow.location.pathname
  const button = (label, scope = 'main') => [...doc().querySelectorAll(scope + ' button')]
    .find(el => el.textContent.trim() === label && el.getClientRects().length)
  const resume = () => by('main a[href="/new-patient"]')
  const navCase = () => by('header a[href="/new-patient"]')
  const notes = () => by('textarea[id^="text-"]')
  const syntheticReport = 'ข้อมูลสมมติ: ผู้ป่วยแจ้งว่าใช้ยาเฉพาะตอนเช้า'
  const medicine = 'Synthetic Home Test A'
  const previousLanguage = localStorage.getItem('medrec.language')

  async function expect(check, description) {
    for (let i = 0; i < 100; i++) {
      if (check()) return
      await new Promise(resolve => setTimeout(resolve, 50))
    }
    throw new Error(description)
  }

  function type(control, value) {
    Object.getOwnPropertyDescriptor(Object.getPrototypeOf(control), 'value').set.call(control, value)
    control.dispatchEvent(new Event('input', { bubbles: true }))
  }

  const english = {
    language: 'en', title: 'Home', newPatient: 'New Patient', fresh: 'Start fresh case', resume: 'Resume case',
    stages: ['Input', 'Review', 'Output'], capture: /label sides.*optional second photo.*flip the same items/,
    verify: /label directions.*reported use/, print: /print.*handoff/i, approve: /pharmacist.*approve.*import/i,
  }
  const thai = {
    language: 'th', title: 'หน้าหลัก', newPatient: 'ผู้ป่วยใหม่', fresh: 'เริ่มเคสใหม่', resume: 'กลับไปยังเคสเดิม',
    stages: ['ป้อนข้อมูล', 'ทบทวน', 'ผลลัพธ์'], capture: /ด้านฉลาก.*หากถ่ายภาพที่สอง.*ตำแหน่งเดิม/,
    verify: /วิธีใช้บนฉลาก.*วิธีใช้ที่ผู้ป่วยแจ้ง/, print: /พิมพ์เอกสารส่งต่อ/, approve: /เภสัชกร.*อนุมัติ.*นำเข้า/,
  }

  async function checkHome(t, active) {
    await expect(() => path() === '/' && by('h1')?.textContent === t.title && doc().documentElement.lang === t.language,
      t.title + ' opens in the selected language')
    await expect(() => button(t.fresh) && navCase()?.textContent.trim() === (active ? t.resume : t.newPatient) &&
      (active ? resume()?.textContent.trim() === t.resume : !resume()), t.title + ' names each available case action')
    const steps = [...doc().querySelectorAll('main li')]
    await expect(() => steps.length === 3 && steps.every((step, i) => step.querySelector('h2')?.textContent === t.stages[i])
      && t.capture.test(steps[0].textContent) && t.verify.test(steps[1].textContent) && t.print.test(steps[1].textContent)
      && t.approve.test(steps[2].textContent) && !t.print.test(steps[2].textContent),
      t.title + ' explains capture, verification and printing in Review, and pharmacist import in Output')
  }

  try {
    localStorage.removeItem('medrec.language')
    frame.src = '/'
    await checkHome(english, false)
    button(english.fresh).click()
    await expect(() => path() === '/new-patient/input' && notes(), 'Start fresh opens empty Input')
    type(notes(), syntheticReport)
    button('Enter medicine manually').click()
    const field = name => [...doc().querySelectorAll('label')].find(el => el.firstChild?.textContent.trim() === name)?.control
    type(field('Product name or code'), medicine)
    type(field('Source wording or reference'), 'Synthetic transfer note')
    await expect(() => button('Add to draft') && !button('Add to draft').disabled, 'Medicine entry is ready')
    button('Add to draft').click()
    by('a[href="/new-patient/review"]').click()
    await expect(() => by('article h2')?.textContent === medicine, 'Review shows the accepted medicine')

    by('header a[href="/"]').click()
    await checkHome(english, true)
    button(english.fresh).click()
    await expect(() => by('dialog[open]'), 'Starting from Home confirms before discarding')
    button('Keep current case', 'dialog[open]').click()
    await expect(() => !by('dialog[open]') && path() === '/', 'Cancel keeps staff on Home')
    resume().click()
    await expect(() => path() === '/new-patient/review' && by('article h2')?.textContent === medicine,
      'Resuming after cancel restores the stage and accepted row')

    by('header a[href="/"]').click()
    await checkHome(english, true)
    by('button[title="Switch to Thai"]').click()
    await checkHome(thai, true)
    frame.width = '320'
    await expect(() => doc().documentElement.scrollWidth <= 320, 'Thai Home wraps at phone width')
    navCase().click()
    await expect(() => path() === '/new-patient/review' && by('article h2')?.textContent === medicine,
      'Thai navigation resumes the same stage and row')
    by('a[href="/new-patient/input"]').click()
    await expect(() => notes()?.value === syntheticReport, 'The sourced report survives cancel and resume')

    by('header a[href="/"]').click()
    await checkHome(thai, true)
    button(thai.fresh).click()
    await expect(() => by('dialog[open]'), 'Thai Home also confirms before discarding')
    button('ทิ้งข้อมูลและเริ่มเคสใหม่', 'dialog[open]').click()
    await expect(() => path() === '/new-patient/input' && notes()?.value === '' && !by('dialog[open]'),
      'Confirming opens a fresh case with empty notes')
    by('a[href="/new-patient/review"]').click()
    await expect(() => path() === '/new-patient/review' && by('h1')?.textContent === 'ทบทวน' &&
      !by('article h2') && !doc().body.textContent.includes(medicine), 'The fresh case contains no old medicine row')
    result.textContent = 'PASS'
  } catch (error) {
    result.textContent = 'FAIL ' + error.message
  } finally {
    if (previousLanguage === null) localStorage.removeItem('medrec.language')
    else localStorage.setItem('medrec.language', previousLanguage)
  }
</script>
</html>
