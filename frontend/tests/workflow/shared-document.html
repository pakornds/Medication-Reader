<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shared source acceptance fixture</title></head>
<body><main id="fixture"></main>
<script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import { MemoryRouter } from 'react-router-dom'
import { CaseHandoff } from '../../src/workflow/ConnectedCase'
import { createClient } from '../../src/api/client'
import { createDraft } from '../../src/pages/new-patient/draft'

// Seed the accepted draft directly so this check exercises the clinical handoff independently of OCR.
window.openSyntheticDraft = async token => {
  const client = createClient('', token)
  const { actor } = await client.session()
  const note = { id: 'ward-list', kind: 'other_record', author: 'Synthetic ward', date: '',
    text: 'Demo Amber 5 mg each morning\nDemo Slate 5 mg each evening' }
  const source = {source_id: note.id}
  const evidence = {notes:[note], photos:[], question:''}
  const medicines = ['Demo Amber', 'Demo Slate'].map((name, index) => ({
    evidence, origin:'analysis', row:{
      id:'row-' + index, identity_status:'named', sources:[source], observed_names:[{value:name, evidence:source}],
      label_fields:{strength:{value:'5 mg', status:'readable', evidence:source}},
      reported_use:[], discrepancies:[], follow_ups:[],
    },
  }))
  const draft={...createDraft(), evidence, medicines}
  createRoot(document.getElementById('fixture')).render(React.createElement(MemoryRouter, {},
    React.createElement(CaseHandoff, {draft, session:{client,actor}, language:'en', record:null,
      onSaved: encounter => { window.savedEncounterId = encounter.id }, onRefresh:()=>{} })))
}
</script>
</body></html>
