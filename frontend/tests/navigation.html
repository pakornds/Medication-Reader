<!doctype html>
<html lang="en">
<title>Top bar browser test</title>
<pre id="result">Running</pre>
<iframe title="Application under test" width="900"></iframe>
<script type="module">
  const frame = document.querySelector('iframe')
  const result = document.querySelector('#result')
  const doc = () => frame.contentDocument
  const visible = selector => Array.from(doc().querySelectorAll(selector)).find(el => el.getClientRects().length)
  async function expect(check, description) {
    for (let i = 0; i < 100; i++) {
      if (check()) return
      await new Promise(resolve => setTimeout(resolve, 50))
    }
    throw new Error(description)
  }
  const heading = title => expect(() => doc()?.querySelector('h1')?.textContent === title, title)
  const previousTheme = localStorage.getItem('medrec.theme')
  const previousLanguage = localStorage.getItem('medrec.language')
  const handoffKey = 'medrec:completed-handoff:nav-fixture'
  const previousHandoff = localStorage.getItem(handoffKey)
  try {
    localStorage.removeItem('medrec.language')
    localStorage.setItem(handoffKey, JSON.stringify({
      createdAt: '2099-01-11T09:10:00.000Z',
      medicines: [{ name: 'Synthetic handoff medicine', strength: null, form: null, tpu: null,
        quantity: '', schedule: { en: [], th: [] } }],
    }))
    frame.src = '/new-patient'
    await heading('Add medicines')
    const stageLinks = [...doc().querySelectorAll('nav[aria-label="New Patient stages"] a')]
    const widths = stageLinks.map(link => link.getBoundingClientRect().width)
    await expect(() => stageLinks.map(link => link.innerText.replace(/\s+/g,' ').trim()).join('|') === '1 Input|2 Review|3 Output', 'numbered stages')
    await expect(() => Math.max(...widths)-Math.min(...widths) <= 1, 'equal stage widths')
    await expect(() => stageLinks.every(link => link.closest('header')) &&
      doc().querySelectorAll('header nav a').length === 4 &&
      !doc().querySelector('header nav a[href="/"]'), 'stages and History share the header')
    const brand = visible('header a[href="/"]')
    await expect(() => brand?.textContent.trim() === 'MedRec TH', 'the project name links home')
    await expect(() => visible('a[aria-current="step"]')?.pathname === '/new-patient/input', 'current stage on direct visit')
    visible('a[href="/new-patient/review"]').click()
    await heading('Review medicines')
    visible('a[href="/new-patient/output"]').click()
    await heading('Handoff')
    await expect(() => visible('a[aria-current="step"]').pathname === '/new-patient/output', 'selected stage')
    const historyLink = visible('a[href="/history"]')
    historyLink.focus()
    await expect(() => doc().activeElement === historyLink, 'keyboard focus on navigation link')
    historyLink.click()
    await heading('History')
    await expect(() => frame.contentWindow.location.pathname === '/history' && !frame.contentWindow.location.hash, 'clean URL')
    frame.contentWindow.history.back()
    await heading('Handoff')
    frame.contentWindow.history.forward()
    await heading('History')
    const reloaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
    frame.contentWindow.location.reload()
    await reloaded
    await heading('History')
    await expect(() => visible('button[title="Switch to Thai"]'), 'language control')
    visible('button[title="Switch to Thai"]').click()
    await heading('ประวัติ')
    const initialTheme = doc().documentElement.dataset.theme
    visible('button:last-child[title]').click()
    await expect(() => doc().documentElement.dataset.theme !== initialTheme, 'theme switch')
    frame.width = '320'
    await expect(() => doc().documentElement.scrollWidth <= 320, 'phone layout fits')
    visible('header a[href="/"]').click()
    await heading('การทบทวนรายการยา')
    await expect(() => visible('a[aria-current="page"]').pathname === '/', 'active home link')
    await expect(() => doc().querySelector('time[datetime="2099-01-11T09:10:00.000Z"]') &&
      !doc().body.textContent.includes('Synthetic handoff medicine'), 'latest handoff summary contains no medicine name')
    await expect(() => doc().documentElement.scrollWidth <= 320, 'home fits on a phone')
    visible('a[href="/new-patient/input"]').click()
    await heading('เพิ่มรายการยา')
    await expect(() => doc().documentElement.scrollWidth <= 320 &&
      visible('a[aria-current="step"]')?.pathname === '/new-patient/input', 'mobile input has an active step and fits')
    visible('a[href="/new-patient/review"]').click()
    await heading('ทบทวนรายการยา')
    visible('a[href="/history"]').click()
    await heading('ประวัติ')
    visible('a[href="/new-patient"]').click()
    await heading('เพิ่มรายการยา')
    visible('a[href="/new-patient/review"]').click()
    await heading('ทบทวนรายการยา')
    const chosenTheme = doc().documentElement.dataset.theme
    const stageReload = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
    frame.contentWindow.location.reload()
    await stageReload
    await heading('ทบทวนรายการยา')
    await expect(() => doc().documentElement.lang === 'th' && frame.contentWindow.location.pathname === '/new-patient/review', 'Thai Review survives reload')
    visible('button[title="เปลี่ยนเป็นภาษาอังกฤษ"]').click()
    await heading('Review medicines')
    const englishReload = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
    frame.contentWindow.location.reload()
    await englishReload
    await heading('Review medicines')
    await expect(() => doc().documentElement.lang === 'en' && localStorage.getItem('medrec.language') === 'en', 'English choice survives reload')
    await expect(() => doc().documentElement.dataset.theme === chosenTheme, 'saved theme survives reload')
    result.textContent = 'PASS'
  } catch (error) {
    result.textContent = 'FAIL ' + error.message
  } finally {
    if (previousLanguage === null) localStorage.removeItem('medrec.language')
    else localStorage.setItem('medrec.language', previousLanguage)
    if (previousTheme === null) localStorage.removeItem('medrec.theme')
    else localStorage.setItem('medrec.theme', previousTheme)
    if (previousHandoff === null) localStorage.removeItem(handoffKey)
    else localStorage.setItem(handoffKey, previousHandoff)
  }
</script>
</html>
