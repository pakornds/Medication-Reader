<!doctype html>
<html lang="en">
<title>Intake browser test</title>
<pre id="result">Running</pre>
<iframe title="Synthetic intake case" width="1100" height="720"></iframe>
<script type="module">
  import { checkScanCatalogue, checkUnspecifiedPresentation } from './scan-catalogue.js'
  const frame = document.querySelector('iframe')
  const result = document.querySelector('#result')
  const doc = () => frame.contentDocument
  const win = () => frame.contentWindow
  const visible = el => el.getClientRects().length > 0
  const button = label => [...doc().querySelectorAll('button')].find(b => visible(b) && b.textContent.trim() === label)
  const field = (text, scope = doc()) => [...scope.querySelectorAll('label')].find(l => visible(l) && l.firstChild.textContent.trim() === text)
    ?.control
  function assert(condition, description) { if (!condition) throw new Error(description) }
  async function expect(check, description) {
    for (let i=0; i<150; i++) {
      if (check()) return
      await new Promise(r => setTimeout(r,30))
    }
    throw new Error(description)
  }
  async function click(label) {
    await expect(() => button(label) && !button(label).disabled, 'enabled button: '+label)
    button(label).click()
  }
  async function openMarking(slot) {
    const panel = () => doc().querySelector('section[aria-label="'+slot+'"] .photo-marking')
    await expect(panel,'photo marking controls: '+slot)
    panel().open = true
    await expect(() => panel().querySelector('.region-coordinates'), 'expanded photo controls')
    return panel()
  }
  async function markSingle(slot) {
    const panel = await openMarking(slot)
    ;[...panel.querySelectorAll('button')].find(b => b.textContent.trim()==='One package fills this entire photo').click()
  }
  function type(control,value) {
    assert(control,'missing input')
    Object.getOwnPropertyDescriptor(Object.getPrototypeOf(control),'value').set.call(control,value)
    control.dispatchEvent(new Event('input',{bubbles:true}))
  }
  function photo(slot,name,contents) {
    const input = doc().querySelector('section[aria-label="'+slot+'"] input[type=file]')
    const transfer = new DataTransfer()
    // Each upload contains only a small synthetic PNG.
    const png = atob(contents || 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+j5OMAAAAASUVORK5CYII=')
    transfer.items.add(new File([Uint8Array.from(png,c=>c.charCodeAt(0))],name,{type:'image/png'}))
    input.files = transfer.files
    input.dispatchEvent(new Event('change',{bubbles:true}))
  }
  function packageLabelPhoto(leftText, rightText) {
    const canvas = document.createElement('canvas')
    canvas.width = 600
    canvas.height = 230
    const graphics = canvas.getContext('2d')
    graphics.fillStyle = '#dce6ee'
    graphics.fillRect(0, 0, 600, 230)
    for (const [left, text] of [[20,leftText],[350,rightText]]) {
      if (!text) continue
      graphics.fillStyle = '#ffffff'
      graphics.fillRect(left, 35, 230, 160)
      graphics.fillStyle = '#193b5a'
      graphics.font = '16px sans-serif'
      graphics.fillText('SYNTHETIC LABEL', left+15, 75)
      graphics.font = 'bold 22px sans-serif'
      graphics.fillText(text, left+15, 116)
      graphics.font = '16px sans-serif'
      graphics.fillText('1 tablet each morning', left+15, 153)
    }
    return canvas.toDataURL('image/png').split(',')[1]
  }
  async function wholeTableCase() {
    localStorage.setItem('medrec.language','en')
    const loaded = new Promise(resolve => frame.addEventListener('load',resolve,{once:true}))
    frame.src = '/new-patient/input'
    await loaded
    await expect(() => button('Analyze evidence'), 'fresh whole-table case')
    photo('Label side','two-packages.png',packageLabelPhoto('Synthetic left','Synthetic right'))
    const slot = () => doc().querySelector('section[aria-label="Label side"]')
    await expect(() => !button('Analyze evidence').disabled && slot().querySelector('img'), 'whole table ready without marking')
    assert(!slot().querySelector('.photo-marking').open, 'manual controls are optional')
    const ids = [crypto.randomUUID(),crypto.randomUUID()]
    const names = ['Synthetic left','Synthetic right']
    let call = 0
    win().fetch = async (_url, init) => {
      const form = JSON.parse(init.body.get('form')), [attachment] = form.photo_source_ids
      assert(init.body.getAll('photos').length===1, 'one original for both packages')
      const boxes = ids.map((id,i)=>({attachment_id:attachment,source_id:id,item_id:id,row_id:id,
        bounds:{x:i*.5,y:0,width:.5,height:1}}))
      if (!call++) {
        assert(form.scene_photo_ids.length===1 && form.scene_photo_ids[0]===attachment, 'unmarked original requested as a scene')
        assert(!form.evidence.items.length, 'no implicit single medicine for whole photo')
      } else {
        assert(!form.scene_photo_ids.length && form.evidence.items.length===2, 'retry reuses both located items')
        assert(form.region_locations[ids[1]][ids[1]]==='50%,0%,50%,100%', 'retry crops use canonical backend percentages')
      }
      return Response.json({case_id:form.evidence.case_id,located_regions:boxes,rows:ids.map((id,i)=>{
        const ref={source_id:id,item_id:id}
        return {id,sources:[ref],identity_status:'named',observed_names:[{value:names[i],evidence:ref}]}
      })})
    }
    await click('Analyze evidence')
    await expect(()=>doc().querySelectorAll('.suggestion').length===2 && slot().querySelectorAll('.region-box').length===2, 'two review rows and two original locations')
    await click('Analyze evidence')
    await expect(()=>doc().querySelectorAll('.suggestion').length===2 && call===2, 'both crops retained on retry')
    const right=doc().querySelectorAll('.suggestion')[1]
    right.querySelector('.citation summary').click()
    await expect(()=>right.querySelector('canvas[data-region="'+ids[1]+'"]'), 'second package opens its own crop')
    doc().querySelectorAll('.suggestion .pick-row input').forEach(input=>input.click())
    await click('Add selected to draft')
    await expect(()=>doc().querySelectorAll('aside .draft-line').length===2, 'two separate medicines from one original')
    photo('Reverse side','reverse.png',packageLabelPhoto('Synthetic left back','Synthetic right back'))
    const reverse = () => doc().querySelector('section[aria-label="Reverse side"]')
    await expect(()=>reverse().querySelector('img'), 'reverse image ready')
    let retry
    win().fetch = async (_url,init) => {
      const form=JSON.parse(init.body.get('form'))
      retry=form
      const reverseId=form.scene_photo_ids[0]
      return Response.json({case_id:form.evidence.case_id,rows:[],located_regions:!reverseId?[]:
        ids.map((_,i)=>{const id=crypto.randomUUID();return {attachment_id:reverseId,source_id:id,item_id:id,row_id:id,bounds:{x:i*.5,y:0,width:.5,height:1}}})})
    }
    await click('Analyze evidence')
    await expect(()=>reverse().querySelectorAll('.region-box').length===2,'reverse packages located')
    await click('Analyze evidence')
    await expect(()=>retry.photo_source_ids.length===1,'unpaired reverse crops cannot become extra medicines on retry')
    const controls=await openMarking('Reverse side')
    const matching=controls.querySelector('.region-editor select')
    matching.value=ids[1]
    matching.dispatchEvent(new Event('change',{bubbles:true}))
    await click('Analyze evidence')
    await expect(()=>retry.evidence.items.filter(i=>i.kind==='pill_crop').length===1,'only the manually paired reverse is submitted')
    assert(retry.evidence.items.find(i=>i.kind==='pill_crop').row_id===ids[1],'reverse attributed to selected front medicine')
  }
  async function scanPrefillCase() {
    localStorage.setItem('medrec.language','en')
    frame.width = '1100'
    const loaded = new Promise(resolve => frame.addEventListener('load',resolve,{once:true}))
    frame.src = '/new-patient/input'
    await loaded
    await expect(() => button('Analyze evidence'), 'fresh scan prefill case')

    const labelSlot = () => doc().querySelector('section[aria-label="Label side"]')
    const draftRows = () => [...doc().querySelectorAll('.draft-line')]
    const picks = () => [...doc().querySelectorAll('.pick-row')]
    const suggestion = text => picks().map(pick => pick.closest('.suggestion')).find(row => (
      row.querySelector('.pick-row').textContent.includes(text) || row.querySelector('.row-evidence').textContent.includes(text)
    ))
    function selectOrder(row, text) {
      const select = row.querySelector('select')
      const choice = [...select.options].find(option => option.textContent.includes(text))
      assert(choice, 'available draft order: '+text)
      select.value = choice.value
      select.dispatchEvent(new Event('change',{bubbles:true}))
    }
    async function accept(row, existingStrength) {
      assert(row, 'visible scan suggestion')
      if (existingStrength) selectOrder(row, existingStrength)
      row.querySelector('.pick-row input').click()
      await click('Add selected to draft')
      await expect(() => !row.isConnected, 'confirmed suggestion removed from preview')
    }
    async function markRegion(bounds, clinic, count) {
      const controls = (await openMarking('Label side')).querySelector('details')
      controls.open = true
      for (const [index, label] of ['Left','Top','Width','Height'].entries()) {
        type(field(label, controls), String(bounds[index]))
      }
      await click('Save region')
      await expect(() => labelSlot().querySelectorAll('.region-editor').length===count, 'new item bounds saved')
      type(field('Facility on this item (if known)', labelSlot().querySelectorAll('.region-editor')[count-1]), clinic)
    }
    async function showCitation(row, description, facility) {
      const value = [...row.querySelectorAll('.row-evidence > div')].find(el => el.firstElementChild?.textContent==='Strength' && el.textContent.includes(description))
      const citation = value?.querySelector('details')
      assert(citation, 'strength has a dedicated citation: '+description)
      citation.querySelector('summary').click()
      const image = () => citation.querySelector('.region-image canvas[data-region]')
      await expect(() => citation.open && image()?.width===270 && image()?.height===230, 'citation displays its cropped region: '+description)
      assert(citation.querySelector('small')?.textContent.includes(facility), 'crop belongs to '+facility)
      return image().dataset.region
    }

    let scanCount = 0
    let deferScan = false
    let completeOldScan
    let oldSignal
    const facilityPhones = {
      'Demo North Facility':'000-000-0505',
      'Demo South Facility':'000-000-1010',
      'Demo South Facility Retake':'000-000-0909',
    }
    win().fetch = async (url, options) => {
      if (String(url).includes('/checks/local/products')) return Response.json({tmt_release:'demo',products:[]})
      assert(String(url).endsWith('/medication-analysis'), 'scan prefill uses analysis endpoint')
      const form = JSON.parse(options.body.get('form'))
      const request = ++scanCount
      const dispensingFacilities = {}
      const rows = form.evidence.items.map(item => {
        const ref = {source_id:item.source_id,item_id:item.id}
        const isAppearance = item.kind === 'pill_crop'
        const facility = form.evidence.sources.find(source => source.id===item.source_id)?.organization ?? ''
        if (facilityPhones[facility]) {
          dispensingFacilities[item.row_id] = {evidence:ref,organization:facility,organization_phone:facilityPhones[facility]}
        }
        const strength = facility.includes('North') ? '5 mg' : request === 1 ? '10 mg' : '9 mg'
        const directions = {
          directions_text:'1 tablet each morning',dose_amount:1,dose_unit:'tablet',
          schedule_type:'frequency',frequency_count:1,period_value:1,period_unit:'day',time_of_day:['morning'],
        }
        return {
          id:item.row_id,
          identity_status:isAppearance?'unlabeled':'named',
          unknown_label:isAppearance?'Unmatched appearance':null,
          observed_names:isAppearance?[]:[{value:facility.includes('Retake')?'Demo retake reading':'Demo order',evidence:ref}],
          label_fields:isAppearance?{}:{
            strength:{value:strength,status:'readable',evidence:ref},
            directions:{value:directions.directions_text,status:'readable',evidence:ref},
          },
          regimens:isAppearance?[]:[{
            component_id:item.id+'-regimen',basis:'documented',parse_status:'complete',
            ...directions,route:null,meal_relation:null,
            evidence:Object.fromEntries(Object.keys(directions).map(key => [key,ref])),
          }],
          sources:[ref],reported_use:[],discrepancies:[],follow_ups:[],reverse_crop:isAppearance?ref:null,
        }
      })
      const response = () => Response.json({case_id:form.evidence.case_id,rows,unassigned_reports:[],dispensing_facilities:dispensingFacilities})
      if (deferScan) return new Promise(resolve => {
        oldSignal = options.signal
        completeOldScan = () => resolve(response())
      })
      return response()
    }

    await click('Enter medicine manually')
    type(field('Product name or code'), 'Demo order')
    type(field('Strength'), '5 mg')
    type(field('Form'), 'Tablet')
    type(field('Source wording or reference'),'Synthetic manual 5 mg order')
    await click('Add to draft')
    await expect(() => draftRows().length===1 && draftRows()[0].textContent.includes('5 mg'), '5 mg manual order')

    await click('Read photos or notes')
    photo('Label side','neighboring-labels.png',packageLabelPhoto('Demo order 5 mg','Demo order 10 mg'))
    await expect(() => labelSlot().querySelector('details'), 'photo region controls')
    await markRegion([0,0,45,100], 'Demo North Facility', 1)
    await markRegion([55,0,45,100], 'Demo South Facility', 2)
    photo('Reverse side','separate-appearance.png')
    await expect(() => doc().querySelector('section[aria-label="Reverse side"] .region-image'), 'reverse side ready')
    await markSingle('Reverse side')
    await click('Analyze evidence')
    await expect(() => picks().length===3, 'two regional observations and one unmatched appearance')

    const northSuggestion = suggestion('5 mg')
    const southSuggestion = suggestion('10 mg')
    const north = await showCitation(northSuggestion, '5 mg', 'Demo North Facility')
    const south = await showCitation(southSuggestion, '10 mg', 'Demo South Facility')
    assert(north!==south, 'neighboring fields open different crops on the shared attachment')
    assert(northSuggestion.textContent.includes(facilityPhones['Demo North Facility']) && !northSuggestion.textContent.includes(facilityPhones['Demo South Facility']), 'only the 5 mg dispensing phone is shown for the north label')
    assert(southSuggestion.textContent.includes(facilityPhones['Demo South Facility']) && !southSuggestion.textContent.includes(facilityPhones['Demo North Facility']), 'only the 10 mg dispensing phone is shown for the south label')
    const directions = southSuggestion.textContent
    const directionFields = [...southSuggestion.querySelectorAll('.regimen-sources dt')]
    assert(directions.includes('Structured directions') && directions.includes('1 tablet each morning'), 'verbatim wording and structured directions are visible')
    for (const [label,value] of [['Dose amount','1'], ['Dose unit','tablet'], ['Frequency count','1'], ['Period length','1'], ['Period unit','day'], ['Time of day','morning']]) {
      const fieldValue = directionFields.find(term => term.textContent===label)?.nextElementSibling
      assert(fieldValue?.firstChild?.textContent.trim()===value && fieldValue.querySelector('details'), 'directions retain the sourced '+label.toLowerCase())
    }
    assert(!directionFields.some(term => ['Route','Relation to meals'].includes(term.textContent)), 'route and meals remain unspecified')
    const appearance = suggestion('Unmatched appearance')
    ;[...appearance.querySelectorAll('button')].find(b => b.textContent.trim()==='Dismiss suggestion').click()
    await expect(() => !appearance.isConnected && picks().length===2 && draftRows().length===1, 'dismissal preserves the other suggestions and existing order')
    await accept(suggestion('5 mg'), '5 mg')
    assert(draftRows().length===1, 'explicit attachment does not duplicate the manual order')
    await accept(suggestion('10 mg'))
    await expect(() => draftRows().length===2, '10 mg remains a separate order')

    const review = () => doc().querySelector('a[href="/new-patient/review"]').click()
    const input = () => doc().querySelector('a[href="/new-patient/input"]').click()
    const reviewRows = () => [...doc().querySelectorAll('article')]
    const reviewSources = text => reviewRows().find(row => row.textContent.includes(text))
    review()
    await expect(() => reviewRows().length===2, 'review the two distinct orders')
    const manualOrder = reviewSources('Synthetic manual 5 mg order')
    assert(manualOrder?.textContent.includes('Demo North Facility') && !manualOrder.textContent.includes('Demo South Facility'), 'manual source and attached crop stay on the 5 mg row')
    assert(manualOrder.textContent.includes(facilityPhones['Demo North Facility']) && !manualOrder.textContent.includes(facilityPhones['Demo South Facility']), 'the attached manual order retains just its dispensing phone')
    const scannedOrder = reviewSources('Demo South Facility')
    assert(scannedOrder && !scannedOrder.textContent.includes('Demo North Facility'), 'neighboring facility stays off the 10 mg order')
    assert(scannedOrder.textContent.includes(facilityPhones['Demo South Facility']) && !scannedOrder.textContent.includes(facilityPhones['Demo North Facility']), 'the separate scanned order retains just its dispensing phone')
    const correction = scannedOrder.querySelector('.med-corrections')
    correction.querySelector('summary').click()
    correction.querySelector('button[type="submit"]').click()
    assert(!scannedOrder.querySelector('.staff-corrections'), 'saving unchanged fields does not mark observations as staff corrections')
    type(field('Draft strength', correction), '12 mg')
    correction.querySelector('button[type="submit"]').click()
    await expect(() => scannedOrder.textContent.includes('12 mg'), 'staff correction saved to the intended order')
    const finishOldLookup = await checkScanCatalogue({ frame: win(), manualOrder, scannedOrder, expect, assert, type })
    assert(scannedOrder.querySelector('.staff-corrections').querySelectorAll('dt').length===1
      && scannedOrder.querySelector('.staff-corrections dt').textContent==='Draft strength',
      'only the changed strength is attributed to staff')

    input()
    await finishOldLookup()
    await expect(() => draftRows().some(row => row.textContent.includes('12 mg')), 'correction reflected in the draft')
    await click('Analyze evidence')
    await expect(() => suggestion('9 mg'), 'new reading from the original source is available for inspection')
    const sameRegion = suggestion('9 mg')
    const orderOptions = [...sameRegion.querySelector('select').options]
    assert(!orderOptions.some(option => option.textContent.includes('Add as a new medicine')), 'a previously attached region cannot create a duplicate by default')
    assert(draftRows().some(row => row.textContent.includes('12 mg')), 'reanalysis alone preserves the correction')
    await accept(sameRegion, '12 mg')
    assert(draftRows().length===2 && draftRows().some(row => row.textContent.includes('12 mg')), 'confirming repeat analysis preserves the corrected row and count')

    deferScan = true
    await click('Analyze evidence')
    await expect(() => completeOldScan, 'analysis still in flight when retaking the photo')
    photo('Label side','retaken-labels.png',packageLabelPhoto('','Retake reading 9 mg'))
    await expect(() => !button('Analyze evidence')?.disabled && !picks().length, 'retake clears suggestions and enables whole-photo analysis')
    assert(oldSignal.aborted, 'retake aborts the obsolete analysis request')
    completeOldScan()
    await new Promise(resolve => setTimeout(resolve,50))
    assert(!picks().length && draftRows().length===2, 'old response does not restore a stale scan or alter draft rows')

    deferScan = false
    await markRegion([55,0,45,100], 'Demo South Facility Retake', 1)
    await click('Analyze evidence')
    await expect(() => suggestion('Demo South Facility Retake'), 'retaken crop is a separately sourced suggestion')
    await accept(suggestion('Demo South Facility Retake'), '12 mg')
    assert(draftRows().length===2 && draftRows().some(row => row.textContent.includes('12 mg')), 'explicit retake link preserves the correction and the separate 5 mg order')
    review()
    await expect(() => reviewSources('Demo South Facility Retake'), 'linked retake visible in Review')
    const linkedOrder = reviewSources('Demo South Facility Retake')
    const oldManual = reviewSources('Synthetic manual 5 mg order')
    assert(oldManual && !oldManual.querySelector('.selected-trade-product') && oldManual.textContent.includes('Demo North Facility'),
      'retaking the original photo clears its active catalogue selection while preserving manual and earlier scan evidence')
    assert(linkedOrder.textContent.includes('neighboring-labels.png') && linkedOrder.textContent.includes('retaken-labels.png'), 'both original and retaken source remain attributable')
    assert(linkedOrder.textContent.includes(facilityPhones['Demo South Facility']) && linkedOrder.textContent.includes(facilityPhones['Demo South Facility Retake']) && !linkedOrder.textContent.includes(facilityPhones['Demo North Facility']), 'retake preserves both attributed dispensing phones without borrowing the neighboring number')
    assert(linkedOrder.querySelector('h2').textContent==='Demo order' && linkedOrder.textContent.includes('Demo retake reading'), 'retaken identity is preserved as an observation without overwriting the order')
    input()
    await click('Enter medicine manually')
    type(field('Product name or code'), 'Second documented order')
    type(field('Strength'), '9 mg')
    type(field('Form'), 'Tablet')
    type(field('Source wording or reference'), 'Synthetic separate order for the same package')
    await click('Add to draft')
    await expect(() => draftRows().length===3, 'second order added independently')
    await click('Read photos or notes')
    await click('Analyze evidence')
    await expect(() => suggestion('Demo South Facility Retake'), 'same physical crop can be reviewed again')
    await accept(suggestion('Demo South Facility Retake'), 'Second documented order')
    review()
    await expect(() => reviewRows().filter(r => r.textContent.includes('Demo South Facility Retake')).length===2,
      'explicit confirmation links one package to two distinct orders')
    assert(reviewRows().length===3, 'sharing a crop does not merge orders or duplicate a scan row')
    const clearedOrder = reviewRows().find(row => row.querySelector('h2').textContent==='Demo order'
      && row.textContent.includes('12 mg'))
    const edit = clearedOrder.querySelector('.med-corrections')
    edit.open = true
    type(field('Draft name', edit), '')
    edit.querySelector('button[type="submit"]').click()
    await expect(() => clearedOrder.querySelector('h2').textContent==='Unknown medicine', 'cleared draft name stays unresolved')
    assert(clearedOrder.querySelector('.row-evidence').textContent.includes('Demo order'),
      'original documented name remains visible as evidence after clearing')
  }
  const previousLanguage = localStorage.getItem('medrec.language')
  try {
    localStorage.setItem('medrec.language','en')
    frame.src = '/new-patient/input'
    await expect(() => button('Analyze evidence'), 'input screen')
    assert(button('Analyze evidence').disabled,'empty case disabled')
    assert(doc().querySelectorAll('.input-modes button').length===2,'two intake modes')
    assert(visible(field('Patient or caregiver report')) && visible(field('Other source note')), 'written evidence alongside photos')
    assert(!doc().querySelector('aside a'), 'empty draft has no review action')
    const question = doc().querySelector('textarea[aria-label="Question for the agent"]')
    assert(!question.closest('details').open, 'agent question starts collapsed')
    question.closest('details').querySelector('summary').click()
    type(question,'Which evidence needs review?')
    await new Promise(r => setTimeout(r,0))
    assert(button('Analyze evidence').disabled,'questions alone are insufficient')

    let finishFailedRequest
    let scenario = 'fail'
    const searches = []
    let resolveEarlierSearch
    let submitted, uploaded, sent
    win().fetch = async (url,options) => {
      if (String(url).includes('/checks/local/products')) {
        const term = new URL(url, win().location.href).searchParams.get('q')
        searches.push(term)
        if (term === 'earlier') return new Promise(resolve => { resolveEarlierSearch = resolve })
        return Response.json({tmt_release:'demo',products:term.startsWith('demo') ? [
          {tpu:'0007',label:'Demo M tablet',active_tmt:true,strength:'5 mg',dose_form:'tablet'}
        ] : []})
      }
      if (String(url).endsWith('/regimens/parse')) {
        const body = JSON.parse(options.body)
        return Response.json({row_id:body.row_id,regimens:[{component_id:body.component_id,basis:body.basis,
          directions_text:body.directions_text,parse_status:'complete',dose_amount:1,dose_unit:'tablet',time_of_day:['morning'],
          evidence:{directions_text:body.source,dose_amount:body.source,dose_unit:body.source,time_of_day:body.source}}]})
      }
      assert(String(url).endsWith('/medication-analysis'),'expected endpoint')
      submitted = JSON.parse(options.body.get('form'))
      uploaded = options.body.getAll('photos').map(file => file.name)
      sent = (sent || 0)+1
      if (scenario === 'fail') return new Promise(resolve => { finishFailedRequest = () => resolve(new Response('',{status:503})) })
      const rows = submitted.evidence.items.map(item => {
        const ref = {source_id:item.source_id,item_id:item.id}
        const named = item.kind === 'label_region'
        return {id:item.row_id,identity_status:named?'named':'unlabeled',unknown_label:named?null:'Unknown medication A',
          sources:[ref],observed_names:named?[{value:'Demo A',evidence:ref}]:[],
          regimens:named?[{component_id:'scan-timing',basis:'documented',directions_text:'1 tablet each morning',
            parse_status:'complete',dose_amount:1,dose_unit:'tablet',schedule_type:'frequency',frequency_count:1,
            period_value:1,period_unit:'day',time_of_day:['morning'],evidence:Object.fromEntries(
              ['directions_text','dose_amount','dose_unit','schedule_type','frequency_count','period_value','period_unit','time_of_day'].map(k=>[k,ref]))}]:[],
          label_fields:{},reported_use:[],discrepancies:[],follow_ups:[],reverse_crop:named?null:ref}
      })
      return Response.json({case_id:submitted.evidence.case_id,rows,unassigned_reports:submitted.patient_report})
    }

    type(field('Patient or caregiver report'),'ผู้ป่วยบอกว่าใช้เฉพาะตอนเช้า')
    assert(doc().querySelector('.intake-title p')?.textContent.includes('one or more available sources'),'guidance beneath page title')
    assert(doc().querySelector('#notes-heading')?.textContent==='Reports and clinical notes','written evidence section heading')
    for (const action of ['Add another report', 'Add another record']) {
      await click(action)
      const extra = doc().querySelector('.note-block:last-of-type')
      type(extra.querySelector('textarea'), 'Synthetic extra evidence')
      extra.querySelector('button').click()
      await expect(() => !extra.isConnected && doc().querySelectorAll('.note-block').length===2,'remove specific added note')
    }
    assert(field('Patient or caregiver report').value.includes('ตอนเช้า'),'original report preserved')
    const extraPhoto = () => doc().querySelector('section[aria-label="Additional photo"]')
    await click('Add another photo')
    extraPhoto().querySelector('button[aria-label^="Remove"]').click()
    await expect(() => !extraPhoto(),'dismiss an empty extra photo')
    await click('Add another photo')
    photo('Additional photo','extra.png')
    await expect(() => extraPhoto()?.querySelector('img'),'uploaded extra photo')
    await click('Add another photo')
    doc().querySelector('button[aria-label="Remove Additional photo extra.png"]').click()
    await expect(() => !extraPhoto()?.querySelector('img') && extraPhoto()?.querySelector('input[type=file]'),'removing an upload preserves the other open slot')
    extraPhoto().querySelector('button[aria-label^="Remove"]').click()
    await click('Analyze evidence')
    await expect(() => button('Analyzing…')?.disabled && button('Analyzing…').getAttribute('aria-busy') === 'true', 'loading feedback during analysis')
    assert(button('Analyzing…').querySelector('svg').classList.contains('motion-safe:animate-spin'), 'loading spinner')
    finishFailedRequest()
    await expect(() => doc().querySelector('[role=alert]'), 'recoverable failure')
    assert(submitted.patient_report.length===1 && !uploaded.length && submitted.other_source_notes.length===0,'text-only request')
    assert(field('Patient or caregiver report').value.includes('ตอนเช้า'),'failure preserved text')

    photo('Label side','front.png')
    await markSingle('Label side')
    photo('Reverse side','back.png')
    await expect(() => doc().querySelectorAll('.region-image img').length===2,'separate uploads')
    const reverse = () => doc().querySelector('section[aria-label="Reverse side"]')
    await markSingle('Reverse side')
    await expect(() => reverse().querySelector('select option:nth-child(2)'), 'front item available to match')
    const linked = reverse().querySelector('select')
    linked.selectedIndex=1
    linked.dispatchEvent(new Event('change',{bubbles:true}))
    photo('Label side','front-new.png')
    await expect(() => reverse().querySelector('select').selectedIndex===0 && reverse().querySelectorAll('select option').length===1,'retake invalidated reverse pairing')
    assert(!button('Analyze evidence').disabled,'new front can be analyzed without regions')
    await markSingle('Label side')

    await click('Enter medicine manually')
    assert(!button('Analyze evidence'), 'manual mode only shows its own main action')
    const medicineInput = field('Product name or code')
    medicineInput.focus()
    const fieldTop = () => field('Strength').getBoundingClientRect().top + win().scrollY
    const originalTop = fieldTop()
    type(medicineInput,'Earlier')
    await expect(() => resolveEarlierSearch,'first lookup in flight')
    type(medicineInput,'D')
    type(medicineInput,'De')
    type(medicineInput,'Demo')
    await expect(() => doc().querySelector('.product-list [role=option]:not([aria-disabled=true])'),'typing shows catalogue results')
    resolveEarlierSearch(Response.json({tmt_release:'old',products:[]}))
    await new Promise(resolve => setTimeout(resolve,30))
    assert(searches.join(',')==='earlier,demo','only settled queries reach the catalogue')
    assert(fieldTop()===originalTop,'opening suggestions keeps the form still')
    type(medicineInput,'Demo M')
    assert(doc().querySelector('[role=option]') && fieldTop()===originalTop,'matching choices stay visible during refinement')
    const press = key => medicineInput.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))
    press('Escape')
    await expect(() => medicineInput.getAttribute('aria-expanded')==='false','Escape dismisses choices')
    press('ArrowDown')
    await expect(() => medicineInput.getAttribute('aria-activedescendant') && doc().activeElement===medicineInput,'arrow navigation retains typing focus')
    press('Enter')
    await expect(() => medicineInput.value==='Demo M tablet' && field('Strength').value==='5 mg' && field('Form').value==='tablet','selection fills the product presentation')
    type(medicineInput,'Unlisted')
    await expect(() => searches.includes('unlisted') && !doc().querySelector('.product-list [aria-disabled=false]'),'unlisted name can be entered')
    assert(field('Strength').value==='' && !field('Strength').readOnly && field('Form').value==='','changing identity clears the prior presentation')
    type(medicineInput,'Demo')
    await expect(() => doc().querySelector('.product-list [role=option]:not([aria-disabled=true])'),'can reselect after a manual name')
    doc().querySelector('.product-list [role=option]:not([aria-disabled=true])').click()
    type(field('Source wording or reference'),'Synthetic transfer record listing Demo M tablet')
    type(field('Quantity prescribed (as written)'),'21 tablets')
    const wording = field('Directions as written or reported')
    type(wording,'1 tablet each morning')
    await click('Fill fields from wording')
    await expect(() => field('Dose per use').value==='1','parsed dose available to amend')
    type(field('Dose per use'),'1.5')
    type(wording,'No morning doses')
    await expect(() => field('Dose per use').value==='' && button('Morning').getAttribute('aria-pressed')==='false','replacement source withdraws amended and parsed values')
    type(wording,'')
    type(field('Dose per use'),'2')
    wording.focus()
    type(wording,'2')
    type(wording,'2 tablets at night')
    wording.blur()
    assert(field('Dose per use').value==='2','first-time wording preserves manually entered fields')
    type(field('Dose per use'),'2')
    type(field('Dose unit'),'tablets')
    await click('Night')
    await click('Read photos or notes')
    assert(field('Patient or caregiver report').value.includes('ตอนเช้า'),'evidence retained across modes')
    await click('Enter medicine manually')
    assert(field('Product name or code').value==='Demo M tablet','unfinished manual entry retained')
    await click('Add to draft')
    await expect(() => doc().querySelector('.draft-line')?.textContent.includes('Demo M'), 'manual draft row')

    await click('Read photos or notes')
    scenario = 'ok'
    await click('Analyze evidence')
    await expect(() => doc().querySelectorAll('.pick-row').length===2,'named and unknown suggestions')
    assert(submitted.evidence.items.length===2 && uploaded.includes('front-new.png') && uploaded.includes('back.png'),'source-linked multipart')
    assert(submitted.patient_report[0].value.includes('ตอนเช้า') && submitted.question.includes('review'),'evidence and question roles')
    assert(!submitted.evidence.sources.some(s => s.id===submitted.question),'question outside evidence')
    assert(doc().querySelectorAll('.draft-line').length===1,'preview requires confirmation')
    doc().querySelector('.pick-row input').click()
    await click('Add selected to draft')
    await expect(() => doc().querySelectorAll('.draft-line').length===2,'confirmed only the selected row')
    assert(doc().querySelectorAll('.pick-row').length===1,'unselected suggestion still available')
    doc().querySelector('a[href="/history"]').click()
    await expect(() => doc().querySelector('h1')?.textContent === 'History','navigate away')
    doc().querySelector('a[href="/new-patient"]').click()
    await expect(() => doc().querySelectorAll('.draft-line').length===2,'case survives navigation')
    doc().querySelector('a[href="/new-patient/review"]').click()
    await expect(() => doc().querySelectorAll('article').length===2,'review has confirmed rows')
    assert(doc().querySelector('article').textContent.includes('0007'),'catalogue product retained as string')
    const [manualReview,scanReview] = doc().querySelectorAll('article')
    assert(manualReview.textContent.includes('21 tablets') && manualReview.querySelector('.regimen-readback dl').textContent.includes('2 tablets')
      && manualReview.querySelector('.regimen-readback dl').textContent.includes('Night'),'manual package quantity and dose remain separate')
    assert(scanReview.querySelector('.regimen-readback dl').textContent.includes('Morning')
      && scanReview.querySelector('.regimen-readback').textContent.includes('1 tablet each morning'),'scan and manual schedules use the same readback')
    doc().querySelector('button[title="Switch to Thai"]').click()
    await expect(() => doc().querySelector('h1').textContent === 'ทบทวน','Thai review')
    frame.width='320'
    doc().querySelector('a[href="/new-patient/input"]').click()
    await expect(() => doc().querySelector('h1').textContent==='เพิ่มรายการยา','Thai intake')
    assert(doc().documentElement.scrollWidth<=320,'phone layout')
    const draftPanel = doc().querySelector('aside')
    const namedDraft = name => [...draftPanel.querySelectorAll('.draft-line')].find(el => el.querySelector('strong').textContent===name)
    namedDraft('Demo M tablet').querySelector('button').click()
    await expect(() => !namedDraft('Demo M tablet') && namedDraft('Demo A'), 'remove only the manual row')
    assert(draftPanel.querySelector('.count').textContent==='1','draft count updated')
    assert(doc().querySelectorAll('.pick-row').length===1,'remaining suggestion preserved')
    draftPanel.querySelector('a').click()
    await expect(() => doc().querySelectorAll('article').length===1 && doc().querySelector('article h2').textContent==='Demo A','removed medicine stays out of Review')
    doc().querySelector('a[href="/new-patient/input"]').click()
    await expect(() => doc().querySelector('aside .draft-line button'), 'return to draft')
    doc().querySelector('aside .draft-line button').click()
    await expect(() => doc().querySelector('aside .empty-case') && !doc().querySelector('aside a'), 'last removal restores empty draft')
    assert(doc().querySelector('.note-block textarea').value.includes('ตอนเช้า'),'removing medicines preserves written evidence')
    assert(sent===2,'only deliberate analysis requests')
    const reloaded = new Promise(resolve => frame.addEventListener('load',resolve,{once:true}))
    win().location.reload()
    await reloaded
    await expect(() => doc()?.querySelector('.empty-case'),'reload clears the open case')
    await scanPrefillCase()
    await wholeTableCase()
    await checkUnspecifiedPresentation({ frame, doc, win, photo, packageLabelPhoto, click, expect, assert, type,
      live: new URLSearchParams(location.search).has('liveCatalogue') })
    result.textContent='PASS'
  } catch(error) {
    result.textContent='FAIL '+error.message
  } finally {
    if (previousLanguage===null) localStorage.removeItem('medrec.language')
    else localStorage.setItem('medrec.language',previousLanguage)
  }
</script>
</html>
