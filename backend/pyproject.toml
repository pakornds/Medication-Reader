[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medication-reader-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=12,<14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = [
    "anyio>=4,<5",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
